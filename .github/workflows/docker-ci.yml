name: Reusable Docker CI

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      tag:
        required: true
        type: string
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
      SLACK_WEBHOOK_URL:
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:${{ inputs.tag }} .

      # Trivy Scan
      - name: Scan Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:${{ inputs.tag }}
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Push Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image_name }}:${{ inputs.tag }}

      - name: Slack Failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{
            \"attachments\": [
              {
                \"color\": \"#ff0000\",
                \"author_name\": \"${{ github.actor }}\",
                \"author_icon\": \"https://github.com/${{ github.actor }}.png\",
                \"title\": \"Tag Docker Image on Push using GitHub shared workflow\",
                \"title_link\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
                \"fields\": [
                  {
                    \"title\": \"Ref\",
                    \"value\": \"${{ github.ref }}\",
                    \"short\": true
                  },
                  {
                    \"title\": \"Event\",
                    \"value\": \"${{ github.event_name }}\",
                    \"short\": true
                  },
                  {
                    \"title\": \"Commit\",
                    \"value\": \"${{ github.sha }}\",
                    \"short\": true
                  }
                ],
                \"text\": \"❌ *Workflow Failed*\\nPush failed for Image: ${{ inputs.image_name }}\\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Check the Run>\",
                \"footer\": \"🔗 GitHub Actions Run\",
                \"footer_icon\": \"https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png\",
                \"ts\": $(date +%s)
              }
            ]
          }" \
          ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Slack Success
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{
            \"attachments\": [
              {
                \"color\": \"#36a64f\",
                \"author_name\": \"${{ github.actor }}\",
                \"author_icon\": \"https://github.com/${{ github.actor }}.png\",
                \"title\": \"Docker Image Build Successful\",
                \"title_link\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
                \"fields\": [
                  {
                    \"title\": \"Ref\",
                    \"value\": \"${{ github.ref }}\",
                    \"short\": true
                  },
                  {
                    \"title\": \"Event\",
                    \"value\": \"${{ github.event_name }}\",
                    \"short\": true
                  },
                  {
                    \"title\": \"Commit\",
                    \"value\": \"${{ github.sha }}\",
                    \"short\": true
                  }
                ],
                \"text\": \"✅ Image built & pushed: ${{ inputs.image_name }}:${{ inputs.tag }}\",
                \"footer\": \"🔗 <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow>\",
                \"footer_icon\": \"https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png\",
                \"ts\": $(date +%s)
              }
            ]
          }" \
          ${{ secrets.SLACK_WEBHOOK_URL }}